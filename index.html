<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPMED Digital Twin Simulator (Pro Edition)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 700px; 
            width: 100%;
        }
        .canvas-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        canvas {
            border-radius: 8px;
            background-color: #e8f4f8;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            /* Aspect Ratio Height : Width = 1.5 : 1 */
            width: 500px;
            height: 750px;
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
            font-size: 13px;
            justify-content: center;
            max-width: 500px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .dot {
            width: 12px; height: 12px; border-radius: 50%;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            width: 100%;
            background: #fafafa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        .control-group label {
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .control-group input {
            width: 100%;
            cursor: pointer;
        }
        .val-display {
            font-size: 12px;
            color: #007bff;
        }
        #status-box {
            padding: 15px;
            width: 100%;
            background: #fff3cd;
            color: #856404;
            border-left: 5px solid #ffeeba;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
            box-sizing: border-box;
        }
        #math-box {
            padding: 15px;
            width: 100%;
            background: #e2f0d9;
            color: #385723;
            border-left: 5px solid #70ad47;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.5;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h1>BPMED Carbon Capture Simulator<br><span style="font-size: 14px; font-weight: normal; color: #666;">Thermodynamic Ion Competition & Faraday's Law Mass Balance</span></h1>

    <div class="container">
        <div class="canvas-section">
            <canvas id="simCanvas" width="500" height="750"></canvas>
            <div class="legend">
                <div class="legend-item"><div class="dot" style="background:#007bff;"></div> OH-</div>
                <div class="legend-item"><div class="dot" style="background:#dc3545;"></div> H+</div>
                <div class="legend-item"><div class="dot" style="background:#6c757d; border:1px solid #333;"></div> CO2</div>
                <div class="legend-item"><div class="dot" style="background:#28a745;"></div> HCO3-</div>
                <div class="legend-item"><div class="dot" style="background:#17a2b8;"></div> NH4+</div>
                <div class="legend-item"><div class="dot" style="background:#6f42c1;"></div> K+</div>
                <div class="legend-item"><div class="dot" style="background:#fd7e14;"></div> Cl-</div>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>Applied Voltage <span class="val-display" id="valVolt">4.0 V/cell</span></label>
                <input type="range" id="slVolt" min="0" max="12" step="0.5" value="4.0">
            </div>
            <div class="control-group">
                <label>Capture Upflow Rate <span class="val-display" id="valCapFlow">30 mL/min</span></label>
                <input type="range" id="slCapFlow" min="5" max="150" step="5" value="30">
            </div>
            <div class="control-group">
                <label>Release Upflow Rate <span class="val-display" id="valRelFlow">60 mL/min</span></label>
                <input type="range" id="slRelFlow" min="5" max="150" step="5" value="60">
            </div>
            <div class="control-group">
                <label>CO2 Gas Flow <span class="val-display" id="valCO2">0.10 L/min</span></label>
                <input type="range" id="slCO2" min="0" max="1.0" step="0.05" value="0.10">
            </div>
            <div class="control-group">
                <label>Electrolyte Conc. <span class="val-display" id="valNaCl">3.0 wt%</span></label>
                <input type="range" id="slNaCl" min="0" max="10" step="0.5" value="3.0">
            </div>
            <div class="control-group">
                <label>NH4 : K Ratio <span class="val-display" id="valRatio">1 : 6</span></label>
                <input type="range" id="slRatio" min="1" max="10" step="1" value="6">
            </div>
        </div>
        
        <div id="math-box">Loading Math Model...</div>
        <div id="status-box">System Initialized. Adjust parameters to observe physics.</div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const slVolt = document.getElementById('slVolt');
        const slCapFlow = document.getElementById('slCapFlow');
        const slRelFlow = document.getElementById('slRelFlow');
        const slCO2 = document.getElementById('slCO2');
        const slNaCl = document.getElementById('slNaCl');
        const slRatio = document.getElementById('slRatio');
        const statusBox = document.getElementById('status-box');
        const mathBox = document.getElementById('math-box');

        // Engineering Unit Mapping
        function updateLabels() {
            document.getElementById('valVolt').innerText = parseFloat(slVolt.value).toFixed(1) + ' V/cell';
            document.getElementById('valCapFlow').innerText = parseInt(slCapFlow.value) + ' mL/min';
            document.getElementById('valRelFlow').innerText = parseInt(slRelFlow.value) + ' mL/min';
            document.getElementById('valCO2').innerText = parseFloat(slCO2.value).toFixed(2) + ' L/min';
            document.getElementById('valNaCl').innerText = parseFloat(slNaCl.value).toFixed(1) + ' wt%';
            document.getElementById('valRatio').innerText = '1 : ' + slRatio.value;
            
            calculateFaraday();
        }
        
        // Faraday's Law Mass Balance Calculation
        function calculateFaraday() {
            let v = parseFloat(slVolt.value);
            let flow_mL = parseInt(slCapFlow.value);
            
            // 假設水解離電位為 0.83V，剩餘電壓轉換為電流 (這裡假設 Cell Resistance, 僅為模型示意)
            let current_A = Math.max(0, (v - 0.83) * 0.45); 
            
            // 法拉第定律計算 OH- 生成率 (假設 85% 電流效率)
            let mol_per_sec = (current_A * 0.85) / 96485;
            
            // 計算出水槽 OH- 理論濃度 (M)
            let flow_L_per_min = flow_mL / 1000;
            let conc_OH = 0;
            if (flow_L_per_min > 0) {
                conc_OH = (mol_per_sec * 60) / flow_L_per_min;
            }
            
            // 理論 CO2 捕捉量 g/hr (假設 50% 氣液吸收率, MW=44.01)
            let co2_g_hr = mol_per_sec * 3600 * 44.01 * 0.5;

            mathBox.innerHTML = `
                <strong>【法拉第定律：即時水解濃度與質能平衡】</strong><br>
                推估系統電流 (I): <span style="color:#000">${current_A.toFixed(2)} A</span><br>
                OH- 理論生成率 : <span style="color:#000">${(mol_per_sec * 1000).toFixed(4)} mmol/s</span><br>
                <strong>捕捉槽出水 OH- 濃度: <span style="color:#c00000">${conc_OH.toFixed(4)} M</span></strong><br>
                <strong>理論 CO2 捕捉質量: <span style="color:#c00000">${co2_g_hr.toFixed(2)} g/hr</span></strong> (設定吸收率 50%)
            `;
        }

        [slVolt, slCapFlow, slRelFlow, slCO2, slNaCl, slRatio].forEach(el => el.addEventListener('input', updateLabels));

        // Physics Boundaries
        let particles = [];
        const LEFT_BP_X = 50;
        const CEM_X = 250;
        const RIGHT_BP_X = 450;

        class Particle {
            constructor(type, x, y) {
                this.type = type;
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.markedForDeletion = false;
                this.evaluatedCrossing = false;
                this.blockedByCEM = false;
            }

            update(volt, capF, relF, nacl) {
                // 將真實單位轉換回動畫引擎能理解的速率
                let baseUpflow = (this.x < CEM_X) ? (capF / 30) * 2 : (relF / 30) * 2;
                
                if (this.type === 'CO2') {
                    this.vy = -(baseUpflow + 1.5); 
                } else {
                    this.vy = -baseUpflow - 0.5; 
                }

                let eForce = (volt / 10) * 1.5;
                
                if (this.type === 'OH-') this.vx = eForce * 1.5;
                if (this.type === 'H+') this.vx = -eForce * 2.5; 
                if (this.type === 'K+') this.vx = -eForce * 0.5; 
                if (this.type === 'NH4+') this.vx = -eForce * 0.4; 
                if (this.type === 'Cl-') this.vx = eForce * 0.4;
                if (this.type === 'HCO3-') this.vx = eForce * 0.3;
                if (this.type === 'CO2') {
                    this.vx = (Math.random() - 0.5) * 1; 
                }

                if (this.blockedByCEM) {
                    this.vx = 0; 
                }

                this.x += this.vx;
                this.y += this.vy;

                if (this.y < -10) this.markedForDeletion = true;

                if (this.x > CEM_X - 5 && this.x < CEM_X + 5) {
                    if (this.type === 'HCO3-' || this.type === 'Cl-' || this.type === 'OH-') {
                        if (this.vx > 0) this.x = CEM_X - 6;
                        if (this.vx < 0) this.x = CEM_X + 6;
                    }
                    
                    if ((this.type === 'H+' || this.type === 'K+' || this.type === 'NH4+') && this.vx < 0) {
                        if (!this.evaluatedCrossing) {
                            this.evaluatedCrossing = true;
                            
                            // 熱力學 Nernst-Planck 模型 (使用真實濃度值作競爭)
                            let h_flux_potential = volt * 0.5; 
                            let salt_flux_potential = nacl * 2.0; 
                            
                            let t_H = h_flux_potential / (h_flux_potential + salt_flux_potential + 0.0001);
                            
                            if (this.type === 'H+') {
                                if (Math.random() > t_H) this.blockedByCEM = true;
                            } else { 
                                let t_salt = 1 - t_H;
                                if (Math.random() > t_salt) this.blockedByCEM = true;
                            }
                        }
                        
                        if (this.blockedByCEM) {
                            this.x = CEM_X + 6;
                        }
                    }
                }

                if (this.x < LEFT_BP_X + 15) this.x = LEFT_BP_X + 15;
                if (this.x > RIGHT_BP_X - 15) this.x = RIGHT_BP_X - 15;
            }

            draw() {
                ctx.beginPath();
                if (this.type === 'CO2') {
                    ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
                    ctx.fillStyle = '#6c757d';
                    ctx.fill();
                    ctx.strokeStyle = '#333';
                    ctx.stroke();
                } else {
                    ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                    if (this.type === 'OH-') ctx.fillStyle = '#007bff';
                    if (this.type === 'H+') ctx.fillStyle = '#dc3545';
                    if (this.type === 'HCO3-') ctx.fillStyle = '#28a745';
                    if (this.type === 'NH4+') ctx.fillStyle = '#17a2b8';
                    if (this.type === 'K+') ctx.fillStyle = '#6f42c1';
                    if (this.type === 'Cl-') ctx.fillStyle = '#fd7e14';
                    ctx.fill();
                }

                ctx.fillStyle = '#444';
                ctx.font = '11px Arial';
                let xOffset = (this.type === 'CO2') ? 10 : 7;
                ctx.fillText(this.type, this.x + xOffset, this.y + 4);
            }
        }

        function spawnParticles() {
            let volt = parseFloat(slVolt.value);
            let co2 = parseFloat(slCO2.value);
            let nacl = parseFloat(slNaCl.value);
            let kRatio = parseInt(slRatio.value); 

            // Visual Scaling (避免畫面被高濃度離子塞滿)
            let volt_vis = volt;
            let co2_vis = co2 * 10;
            // 【核心修正】: 顯示3.0wt%，但視覺渲染強制縮放為三分之一(相當於1.0wt%的粒子數)
            let nacl_vis = nacl / 3; 

            if (Math.random() < (volt_vis / 10) * 0.3) {
                particles.push(new Particle('OH-', LEFT_BP_X + 15, Math.random() * canvas.height));
            }
            if (Math.random() < (volt_vis / 10) * 0.3) {
                particles.push(new Particle('H+', RIGHT_BP_X - 15, Math.random() * canvas.height));
            }

            if (Math.random() < (co2_vis) * 0.15) {
                particles.push(new Particle('CO2', LEFT_BP_X + 40 + Math.random() * 120, canvas.height + 10));
            }

            // 使用視覺縮放值(nacl_vis)來控制生成率，保持畫面乾淨
            if (Math.random() < (nacl_vis / 5) * 1.5) {
                let probNH4 = 1 / (1 + kRatio);
                let cationType = (Math.random() < probNH4) ? 'NH4+' : 'K+';
                
                particles.push(new Particle(cationType, CEM_X + 40 + Math.random() * 120, canvas.height + 10));
                particles.push(new Particle('Cl-', CEM_X + 40 + Math.random() * 120, canvas.height + 10));
            }
        }

        function checkCollisions() {
            let hCrossoverCount = 0;
            for (let i = 0; i < particles.length; i++) {
                let p1 = particles[i];

                if (p1.type === 'H+' && p1.x < CEM_X) hCrossoverCount++;

                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    if (p1.markedForDeletion || p2.markedForDeletion) continue;

                    let dx = p1.x - p2.x;
                    let dy = p1.y - p2.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist < 15) {
                        if ((p1.type === 'CO2' && p2.type === 'OH-') || (p1.type === 'OH-' && p2.type === 'CO2')) {
                            p1.markedForDeletion = true;
                            p2.markedForDeletion = true;
                            particles.push(new Particle('HCO3-', (p1.x+p2.x)/2, (p1.y+p2.y)/2));
                        }
                        if ((p1.type === 'H+' && p2.type === 'OH-') || (p1.type === 'OH-' && p2.type === 'H+')) {
                            if (p1.x < CEM_X && p2.x < CEM_X) {
                                p1.markedForDeletion = true;
                                p2.markedForDeletion = true;
                            }
                        }
                    }
                }
            }
            updateStatusText(hCrossoverCount);
        }

        function updateStatusText(hCross) {
            let relFlow = parseInt(slRelFlow.value);
            let volt = parseFloat(slVolt.value);
            let nacl = parseFloat(slNaCl.value);
            
            if (volt > 7.0 && nacl < 1.0) {
                statusBox.innerHTML = "🔴 DANGER: Severe H+ leakage! Without enough electrolyte, fast H+ easily breaches the CEM and neutralizes the Capture Chamber.";
                statusBox.style.background = "#f8d7da";
                statusBox.style.color = "#721c24";
                statusBox.style.borderLeftColor = "#f5c6cb";
            } else if (hCross > 6) {
                statusBox.innerHTML = "🟡 WARNING: H+ crossover detected. Increase Electrolyte Conc. to boost Cation Competition, or increase Release Upflow.";
                statusBox.style.background = "#fff3cd";
                statusBox.style.color = "#856404";
                statusBox.style.borderLeftColor = "#ffeeba";
            } else {
                statusBox.innerHTML = "🟢 OPTIMAL: Thermodynamics win! High K+/NH4+ concentration and Upflow successfully block H+ leakage. HCO3- is secured.";
                statusBox.style.background = "#d4edda";
                statusBox.style.color = "#155724";
                statusBox.style.borderLeftColor = "#c3e6cb";
            }
        }

        function drawBackground() {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(LEFT_BP_X, 0, CEM_X - LEFT_BP_X, canvas.height);
            ctx.fillStyle = "#fdfdfd";
            ctx.fillRect(CEM_X, 0, RIGHT_BP_X - CEM_X, canvas.height);

            ctx.fillStyle = "#ced4da";
            ctx.fillRect(0, 0, 15, canvas.height); 
            ctx.fillRect(canvas.width - 15, 0, 15, canvas.height); 
            
            ctx.fillStyle = "#495057";
            ctx.font = "bold 14px Arial";
            ctx.fillText("Cathode (-)", 20, 30);
            ctx.fillText("Anode (+)", canvas.width - 95, 30);

            ctx.fillStyle = "#adb5bd";
            ctx.fillRect(LEFT_BP_X, 0, 12, canvas.height);
            ctx.fillRect(RIGHT_BP_X-12, 0, 12, canvas.height);

            ctx.fillStyle = "#ffc107";
            ctx.fillRect(CEM_X - 4, 0, 8, canvas.height);

            ctx.fillStyle = "#212529";
            ctx.font = "bold 14px Arial";
            ctx.fillText("BP", LEFT_BP_X - 4, 60);
            ctx.fillText("CEM", CEM_X - 16, 60);
            ctx.fillText("BP", RIGHT_BP_X - 4, 60);

            ctx.fillStyle = "rgba(0,0,0,0.06)";
            ctx.font = "bold 26px Arial";
            ctx.textAlign = "center";
            ctx.fillText("CAPTURE", (LEFT_BP_X + CEM_X) / 2, canvas.height / 2 - 20);
            ctx.fillText("(Upflow)", (LEFT_BP_X + CEM_X) / 2, canvas.height / 2 + 15);
            ctx.fillText("RELEASE", (CEM_X + RIGHT_BP_X) / 2, canvas.height / 2 - 20);
            ctx.fillText("(Upflow)", (CEM_X + RIGHT_BP_X) / 2, canvas.height / 2 + 15);
            ctx.textAlign = "left"; 
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();
            
            let volt = parseFloat(slVolt.value);
            let capF = parseInt(slCapFlow.value);
            let relF = parseInt(slRelFlow.value);
            let nacl = parseFloat(slNaCl.value);

            spawnParticles();
            checkCollisions();

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update(volt, capF, relF, nacl);
                p.draw();
                if (p.markedForDeletion) {
                    particles.splice(i, 1);
                }
            }

            if (particles.length > 700) {
                particles.splice(0, particles.length - 700);
            }

            requestAnimationFrame(animate);
        }

        updateLabels(); // 載入時觸發第一次計算
        animate();
    </script>
</body>
</html>
