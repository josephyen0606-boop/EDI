<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPMED Digital Twin Simulator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .container {
            display: flex;
            gap: 20px;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 250px;
            background: #fafafa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        .control-group label {
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 5px;
        }
        .control-group input {
            width: 100%;
        }
        .val-display {
            font-size: 12px;
            color: #666;
            text-align: right;
        }
        canvas {
            border-radius: 8px;
            background-color: #e8f4f8;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }
        #status-box {
            margin-top: 20px;
            padding: 15px;
            width: 100%;
            max-width: 800px;
            background: #fff3cd;
            color: #856404;
            border-left: 5px solid #ffeeba;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
        }
        .legend {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            font-size: 13px;
            justify-content: center;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .dot {
            width: 12px; height: 12px; border-radius: 50%;
        }
    </style>
</head>
<body>

    <h1>BPMED Carbon Capture Simulator</h1>

    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label>Applied Voltage <span class="val-display" id="valVolt">50%</span></label>
                <input type="range" id="slVolt" min="0" max="100" value="50">
            </div>
            <div class="control-group">
                <label>Capture Upflow Rate <span class="val-display" id="valCapFlow">50%</span></label>
                <input type="range" id="slCapFlow" min="0" max="100" value="50">
            </div>
            <div class="control-group">
                <label>Release Upflow Rate <span class="val-display" id="valRelFlow">80%</span></label>
                <input type="range" id="slRelFlow" min="0" max="100" value="80">
            </div>
            <div class="control-group">
                <label>CO2 Gas Flow <span class="val-display" id="valCO2">50%</span></label>
                <input type="range" id="slCO2" min="0" max="100" value="50">
            </div>
            <div class="control-group">
                <label>NaCl Concentration <span class="val-display" id="valNaCl">3.0%</span></label>
                <input type="range" id="slNaCl" min="0" max="5" step="0.5" value="3.0">
            </div>
        </div>

        <div>
            <canvas id="simCanvas" width="600" height="400"></canvas>
            <div class="legend">
                <div class="legend-item"><div class="dot" style="background:#007bff;"></div> OH-</div>
                <div class="legend-item"><div class="dot" style="background:#dc3545;"></div> H+</div>
                <div class="legend-item"><div class="dot" style="background:#6c757d; border:1px solid #333;"></div> CO2</div>
                <div class="legend-item"><div class="dot" style="background:#28a745;"></div> HCO3-</div>
                <div class="legend-item"><div class="dot" style="background:#6f42c1;"></div> Na+</div>
                <div class="legend-item"><div class="dot" style="background:#fd7e14;"></div> Cl-</div>
            </div>
        </div>
    </div>

    <div id="status-box">System Initialized. Adjust parameters to observe physics.</div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const slVolt = document.getElementById('slVolt');
        const slCapFlow = document.getElementById('slCapFlow');
        const slRelFlow = document.getElementById('slRelFlow');
        const slCO2 = document.getElementById('slCO2');
        const slNaCl = document.getElementById('slNaCl');
        const statusBox = document.getElementById('status-box');

        // Update displays
        function updateLabels() {
            document.getElementById('valVolt').innerText = slVolt.value + '%';
            document.getElementById('valCapFlow').innerText = slCapFlow.value + '%';
            document.getElementById('valRelFlow').innerText = slRelFlow.value + '%';
            document.getElementById('valCO2').innerText = slCO2.value + '%';
            document.getElementById('valNaCl').innerText = slNaCl.value + '%';
        }
        [slVolt, slCapFlow, slRelFlow, slCO2, slNaCl].forEach(el => el.addEventListener('input', updateLabels));

        // Physics variables
        let particles = [];
        const LEFT_BP_X = 50;
        const CEM_X = 300;
        const RIGHT_BP_X = 550;

        class Particle {
            constructor(type, x, y) {
                this.type = type;
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.markedForDeletion = false;
            }

            update(volt, capF, relF, nacl) {
                // Vertical Flow (Upflow)
                let baseUpflow = (this.x < CEM_X) ? (capF / 100) * 3 : (relF / 100) * 3;
                
                // Buoyancy: CO2 bubbles rise significantly faster
                if (this.type === 'CO2') {
                    this.vy = -(baseUpflow + 1.5); 
                } else {
                    this.vy = -baseUpflow - 0.5; // Slight base drift for ions
                }

                // Horizontal Electric Field Drift (Voltage driven)
                let eForce = (volt / 100) * 2;
                
                if (this.type === 'OH') this.vx = eForce * 0.5;
                if (this.type === 'H') this.vx = -eForce * 0.8; 
                if (this.type === 'Na') this.vx = -eForce * 0.6;
                if (this.type === 'Cl') this.vx = eForce * 0.4;
                if (this.type === 'HCO3') this.vx = eForce * 0.3;
                if (this.type === 'CO2') {
                    // Random wiggle for gas
                    this.vx = (Math.random() - 0.5) * 1; 
                }

                // Apply movement
                this.x += this.vx;
                this.y += this.vy;

                // Boundary Logic
                if (this.y < -10) this.markedForDeletion = true;

                // Middle Membrane (CEM) Logic
                if (this.x > CEM_X - 5 && this.x < CEM_X + 5) {
                    if (this.type === 'HCO3' || this.type === 'Cl' || this.type === 'OH') {
                        // Anions blocked by CEM
                        if (this.vx > 0) this.x = CEM_X - 6;
                        if (this.vx < 0) this.x = CEM_X + 6;
                    }
                    // H+ and Na+ can cross, but crossing probability depends on flow & NaCl competition
                    if (this.type === 'H' || this.type === 'Na') {
                        // Let them cross smoothly
                    }
                }

                // Left & Right BP boundaries (Absolute barriers)
                if (this.x < LEFT_BP_X + 20) this.x = LEFT_BP_X + 20;
                if (this.x > RIGHT_BP_X - 20) this.x = RIGHT_BP_X - 20;
            }

            draw() {
                ctx.beginPath();
                if (this.type === 'CO2') {
                    ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
                    ctx.fillStyle = '#6c757d';
                    ctx.fill();
                    ctx.strokeStyle = '#333';
                    ctx.stroke();
                } else {
                    ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                    if (this.type === 'OH') ctx.fillStyle = '#007bff';
                    if (this.type === 'H') ctx.fillStyle = '#dc3545';
                    if (this.type === 'HCO3') ctx.fillStyle = '#28a745';
                    if (this.type === 'Na') ctx.fillStyle = '#6f42c1';
                    if (this.type === 'Cl') ctx.fillStyle = '#fd7e14';
                    ctx.fill();
                }
            }
        }

        function spawnParticles() {
            let volt = parseInt(slVolt.value);
            let co2 = parseInt(slCO2.value);
            let nacl = parseFloat(slNaCl.value);

            // Water Splitting (Whole surface)
            if (Math.random() < (volt / 100) * 0.3) {
                particles.push(new Particle('OH', LEFT_BP_X + 20, Math.random() * canvas.height));
            }
            if (Math.random() < (volt / 100) * 0.3) {
                particles.push(new Particle('H', RIGHT_BP_X - 20, Math.random() * canvas.height));
            }

            // CO2 Upflow (Bottom Left)
            if (Math.random() < (co2 / 100) * 0.4) {
                particles.push(new Particle('CO2', LEFT_BP_X + 50 + Math.random() * 150, canvas.height + 10));
            }

            // NaCl Upflow (Bottom Right)
            if (Math.random() < (nacl / 5) * 0.5) {
                particles.push(new Particle('Na', CEM_X + 20 + Math.random() * 200, canvas.height + 10));
                particles.push(new Particle('Cl', CEM_X + 20 + Math.random() * 200, canvas.height + 10));
            }
        }

        function checkCollisions() {
            let hCrossoverCount = 0;
            for (let i = 0; i < particles.length; i++) {
                let p1 = particles[i];

                // Check Crossover H+
                if (p1.type === 'H' && p1.x < CEM_X) {
                    hCrossoverCount++;
                }

                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    if (p1.markedForDeletion || p2.markedForDeletion) continue;

                    let dx = p1.x - p2.x;
                    let dy = p1.y - p2.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);

                    // Capture Reaction: CO2 + OH- -> HCO3-
                    if (dist < 15) {
                        if ((p1.type === 'CO2' && p2.type === 'OH') || (p1.type === 'OH' && p2.type === 'CO2')) {
                            p1.markedForDeletion = true;
                            p2.markedForDeletion = true;
                            particles.push(new Particle('HCO3', (p1.x+p2.x)/2, (p1.y+p2.y)/2));
                        }
                        // Neutralization: H+ + OH- -> H2O (Both disappear)
                        if ((p1.type === 'H' && p2.type === 'OH') || (p1.type === 'OH' && p2.type === 'H')) {
                            // Only happens in capture chamber (x < CEM_X)
                            if (p1.x < CEM_X && p2.x < CEM_X) {
                                p1.markedForDeletion = true;
                                p2.markedForDeletion = true;
                            }
                        }
                    }
                }
            }
            updateStatusText(hCrossoverCount);
        }

        function updateStatusText(hCross) {
            let relFlow = parseInt(slRelFlow.value);
            let volt = parseInt(slVolt.value);
            
            if (volt > 70 && relFlow < 30) {
                statusBox.innerHTML = "🔴 WARNING: High H+ crossover! H+ is entering the Capture Chamber and neutralizing OH-!";
                statusBox.style.background = "#f8d7da";
                statusBox.style.color = "#721c24";
                statusBox.style.borderLeftColor = "#f5c6cb";
            } else if (hCross > 5) {
                statusBox.innerHTML = "🟡 Caution: Some H+ is crossing the CEM. Increase Release Flow or NaCl to protect pH.";
                statusBox.style.background = "#fff3cd";
                statusBox.style.color = "#856404";
                statusBox.style.borderLeftColor = "#ffeeba";
            } else {
                statusBox.innerHTML = "🟢 Optimal Operation: Upflow and NaCl are effectively buffering H+ crossover. HCO3- is secured.";
                statusBox.style.background = "#d4edda";
                statusBox.style.color = "#155724";
                statusBox.style.borderLeftColor = "#c3e6cb";
            }
        }

        function drawBackground() {
            // Chambers
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(LEFT_BP_X, 0, CEM_X - LEFT_BP_X, canvas.height); // Capture Chamber
            ctx.fillStyle = "#fdfdfd";
            ctx.fillRect(CEM_X, 0, RIGHT_BP_X - CEM_X, canvas.height); // Release Chamber

            // Left BP
            ctx.fillStyle = "#aaa";
            ctx.fillRect(LEFT_BP_X, 0, 15, canvas.height);
            ctx.fillStyle = "#333";
            ctx.font = "14px Arial";
            ctx.fillText("Left BP", LEFT_BP_X - 45, 50);

            // Right BP
            ctx.fillStyle = "#aaa";
            ctx.fillRect(RIGHT_BP_X-15, 0, 15, canvas.height);
            ctx.fillText("Right BP", RIGHT_BP_X + 5, 50);

            // CEM
            ctx.fillStyle = "#ffc107";
            ctx.fillRect(CEM_X - 4, 0, 8, canvas.height);
            ctx.fillText("CEM", CEM_X - 15, 50);

            // Chamber Labels
            ctx.fillStyle = "rgba(0,0,0,0.1)";
            ctx.font = "bold 24px Arial";
            ctx.fillText("CAPTURE (Upflow)", LEFT_BP_X + 30, canvas.height / 2);
            ctx.fillText("RELEASE (Upflow)", CEM_X + 30, canvas.height / 2);
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();
            
            let volt = parseInt(slVolt.value);
            let capF = parseInt(slCapFlow.value);
            let relF = parseInt(slRelFlow.value);
            let nacl = parseFloat(slNaCl.value);

            spawnParticles();
            checkCollisions();

            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update(volt, capF, relF, nacl);
                p.draw();
                if (p.markedForDeletion) {
                    particles.splice(i, 1);
                }
            }

            // Cap particle limit for performance
            if (particles.length > 500) {
                particles.splice(0, particles.length - 500);
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
