<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPMED Digital Twin Simulator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #eeeeee;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-top: 0; font-size: 24px; color: #4DA8DA; }
        .dashboard {
            display: flex;
            width: 100%;
            max-width: 1000px;
            gap: 20px;
            margin-bottom: 20px;
        }
        .controls {
            flex: 1;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .controls label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        .controls input[type="range"] {
            width: 100%;
            margin-bottom: 15px;
        }
        .kpi-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .kpi-card {
            background: #333;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border-left: 5px solid #4DA8DA;
        }
        .kpi-card h3 { margin: 0 0 5px 0; font-size: 14px; color: #aaa; }
        .kpi-card .value { font-size: 24px; font-weight: bold; }
        
        .canvas-container {
            position: relative;
            background: #111;
            border: 2px solid #555;
            border-radius: 8px;
            overflow: hidden;
        }
        canvas { display: block; }
        .overlay-text {
            position: absolute;
            color: rgba(255,255,255,0.3);
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
        }
        .status-box {
            margin-top: 15px;
            width: 100%;
            max-width: 1000px;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            color: #ffcc00;
            font-family: monospace;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>BPMED Carbon Capture - Digital Twin</h1>

    <div class="dashboard">
        <div class="controls">
            <label>Applied Voltage <span><span id="valVolt">50</span>%</span></label>
            <input type="range" id="slVolt" min="0" max="100" value="50">

            <label>Release Upflow Rate <span><span id="valRelFlow">80</span>%</span></label>
            <input type="range" id="slRelFlow" min="0" max="100" value="80">

            <label>Capture Upflow Rate <span><span id="valCapFlow">40</span>%</span></label>
            <input type="range" id="slCapFlow" min="0" max="100" value="40">

            <label>CO2 Gas Flow <span><span id="valGas">60</span>%</span></label>
            <input type="range" id="slGas" min="0" max="100" value="60">

            <label>NaCl Concentration <span><span id="valNaCl">3.0</span>%</span></label>
            <input type="range" id="slNaCl" min="0" max="5" step="0.5" value="3.0">
        </div>

        <div class="kpi-panel">
            <div class="kpi-card" style="border-color: #28a745;">
                <h3>Carbon Capture Rate</h3>
                <div class="value" id="kpiCapture" style="color: #28a745;">0</div>
            </div>
            <div class="kpi-card" style="border-color: #dc3545;">
                <h3>H+ Crossover Count</h3>
                <div class="value" id="kpiCross" style="color: #dc3545;">0</div>
            </div>
            <div class="kpi-card" style="border-color: #ffc107;">
                <h3>OH- Neutralization Loss</h3>
                <div class="value" id="kpiNeut" style="color: #ffc107;">0</div>
            </div>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="simCanvas" width="900" height="400"></canvas>
        <div class="overlay-text" style="top: 10px; left: 10px;">LEFT BP</div>
        <div class="overlay-text" style="top: 10px; left: 200px;">CAPTURE CHAMBER</div>
        <div class="overlay-text" style="top: 10px; left: 420px;">CEM</div>
        <div class="overlay-text" style="top: 10px; left: 600px;">RELEASE CHAMBER</div>
        <div class="overlay-text" style="top: 10px; right: 10px;">RIGHT BP</div>
    </div>

    <div class="status-box" id="statusMsg">System Initializing...</div>

    <script>
        // DOM Elements
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const slVolt = document.getElementById('slVolt');
        const slRelFlow = document.getElementById('slRelFlow');
        const slCapFlow = document.getElementById('slCapFlow');
        const slGas = document.getElementById('slGas');
        const slNaCl = document.getElementById('slNaCl');
        
        // KPIs
        let capturedCount = 0;
        let crossoverCount = 0;
        let neutralizedCount = 0;

        // Particle System
        let particles = [];
        const CHAMBER_DIVIDER = 450; // Middle (CEM)

        // Colors
        const colors = {
            'OH': '#00ffff',  // Cyan
            'H': '#ff3333',   // Red
            'CO2': '#aaaaaa', // Gray
            'HCO3': '#00ff00',// Green
            'Na': '#ffff00',  // Yellow
            'Cl': '#ff00ff'   // Magenta
        };

        class Particle {
            constructor(type, x, y, vx, vy) {
                this.type = type;
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.markedForDeletion = false;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.type === 'CO2' ? 6 : 4, 0, Math.PI * 2);
                ctx.fillStyle = colors[this.type];
                ctx.fill();
                ctx.closePath();
                
                // Label
                ctx.fillStyle = '#fff';
                ctx.font = '10px Arial';
                ctx.fillText(this.type, this.x + 6, this.y + 3);
            }

            update(vVolt, vCapF, vRelF) {
                // Electric Field Force (Horizontal)
                let eForce = (vVolt / 100) * 1.5;
                if (this.type === 'H' || this.type === 'Na') this.vx -= eForce * 0.1; // Cations move left
                if (this.type === 'OH' || this.type === 'Cl' || this.type === 'HCO3') this.vx += eForce * 0.1; // Anions move right

                // Fluid Dynamics (Vertical)
                let currentChamber = this.x < CHAMBER_DIVIDER ? 0 : 1;
                let upflow = currentChamber === 0 ? (vCapF / 100) * 3 : (vRelF / 100) * 3;
                
                // Buoyancy Rule: CO2 bubbles always rise faster
                let buoyancy = this.type === 'CO2' ? 1.5 : 0;
                
                this.vy = -upflow - buoyancy; // Negative is UP

                // Apply velocity with friction
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.9; // Horizontal drag

                // Boundary Logic
                // Left BP
                if (this.x < 10) { this.x = 10; this.vx *= -1; }
                // Right BP
                if (this.x > canvas.width - 10) { this.x = canvas.width - 10; this.vx *= -1; }
                
                // CEM (Middle) Rules
                if (currentChamber === 0 && this.x > CHAMBER_DIVIDER - 5) {
                    // Block Anions from Capture
                    if (this.type === 'OH' || this.type === 'HCO3') {
                        this.x = CHAMBER_DIVIDER - 5;
                        this.vx *= -1;
                    }
                }
                if (currentChamber === 1 && this.x < CHAMBER_DIVIDER + 5) {
                    // Block Cl- from Release
                    if (this.type === 'Cl') {
                        this.x = CHAMBER_DIVIDER + 5;
                        this.vx *= -1;
