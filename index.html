<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPMED Digital Twin Simulator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .container {
            display: flex;
            flex-direction: column; /* Changed to column to put controls below */
            align-items: center;
            gap: 20px;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 900px;
        }
        .canvas-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        canvas {
            border-radius: 8px;
            background-color: #e8f4f8;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 700px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap; /* Allows wrapping on smaller screens */
            justify-content: center;
            gap: 15px;
            width: 100%;
            background: #fafafa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            width: calc(33% - 15px); /* 3 columns layout */
            min-width: 200px;
        }
        .control-group label {
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 5px;
        }
        .control-group input {
            width: 100%;
        }
        .val-display {
            font-size: 12px;
            color: #666;
            float: right;
        }
        #status-box {
            margin-top: 15px;
            padding: 15px;
            width: 100%;
            background: #fff3cd;
            color: #856404;
            border-left: 5px solid #ffeeba;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
            font-size: 13px;
            justify-content: center;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .dot {
            width: 12px; height: 12px; border-radius: 50%;
        }
    </style>
</head>
<body>

    <h1>BPMED Carbon Capture Simulator</h1>

    <div class="container">
        
        <div class="canvas-section">
            <canvas id="simCanvas" width="700" height="400"></canvas>
            <div class="legend">
                <div class="legend-item"><div class="dot" style="background:#007bff;"></div> OH-</div>
                <div class="legend-item"><div class="dot" style="background:#dc3545;"></div> H+</div>
                <div class="legend-item"><div class="dot" style="background:#6c757d; border:1px solid #333;"></div> CO2</div>
                <div class="legend-item"><div class="dot" style="background:#28a745;"></div> HCO3-</div>
                <div class="legend-item"><div class="dot" style="background:#17a2b8;"></div> NH4+</div>
                <div class="legend-item"><div class="dot" style="background:#6f42c1;"></div> K+</div>
                <div class="legend-item"><div class="dot" style="background:#fd7e14;"></div> Cl-</div>
            </div>
            <div id="status-box">System Initialized. Adjust parameters to observe physics.</div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>Applied Voltage <span class="val-display" id="valVolt">50%</span></label>
                <input type="range" id="slVolt" min="0" max="100" value="50">
            </div>
            <div class="control-group">
                <label>Capture Upflow Rate <span class="val-display" id="valCapFlow">50%</span></label>
                <input type="range" id="slCapFlow" min="0" max="100" value="50">
            </div>
            <div class="control-group">
                <label>Release Upflow Rate <span class="val-display" id="valRelFlow">80%</span></label>
                <input type="range" id="slRelFlow" min="0" max="100" value="80">
            </div>
            <div class="control-group">
                <label>CO2 Gas Flow <span class="val-display" id="valCO2">50%</span></label>
                <input type="range" id="slCO2" min="0" max="100" value="50">
            </div>
            <div class="control-group">
                <label>Electrolyte Conc. (NH4:K = 1:6) <span class="val-display" id="valNaCl">3.0%</span></label>
                <input type="range" id="slNaCl" min="0" max="5" step="0.5" value="3.0">
            </div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const slVolt = document.getElementById('slVolt');
        const slCapFlow = document.getElementById('slCapFlow');
        const slRelFlow = document.getElementById('slRelFlow');
        const slCO2 = document.getElementById('slCO2');
        const slNaCl = document.getElementById('slNaCl');
        const statusBox = document.getElementById('status-box');

        function updateLabels() {
            document.getElementById('valVolt').innerText = slVolt.value + '%';
            document.getElementById('valCapFlow').innerText = slCapFlow.value + '%';
            document.getElementById('valRelFlow').innerText = slRelFlow.value + '%';
            document.getElementById('valCO2').innerText = slCO2.value + '%';
            document.getElementById('valNaCl').innerText = slNaCl.value + '%';
        }
        [slVolt, slCapFlow, slRelFlow, slCO2, slNaCl].forEach(el => el.addEventListener('input', updateLabels));

        // Physics constants & layout
        let particles = [];
        const LEFT_BP_X = 100;
        const CEM_X = 350;
        const RIGHT_BP_X = 600;

        // Strict Charge Balance Quota
        window.crossover_quota = 0;

        class Particle {
            constructor(type, x, y) {
                this.type = type;
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.markedForDeletion = false;
            }

            update(volt, capF, relF, nacl) {
                // Vertical Flow (Upflow)
                let baseUpflow = (this.x < CEM_X) ? (capF / 100) * 3 : (relF / 100) * 3;
                
                // Buoyancy
                if (this.type === 'CO2') {
                    this.vy = -(baseUpflow + 1.5); 
                } else {
                    this.vy = -baseUpflow - 0.5;
                }

                // Horizontal Electric Field Drift
                let eForce = (volt / 100) * 2;
                
                if (this.type === 'OH-') this.vx = eForce * 0.5;
                if (this.type === 'H+') this.vx = -eForce * 0.8; 
                if (this.type === 'K+') this.vx = -eForce * 0.65;
                if (this.type === 'NH4+') this.vx = -eForce * 0.55;
                if (this.type === 'Cl-') this.vx = eForce * 0.4;
                if (this.type === 'HCO3-') this.vx = eForce * 0.3;
                if (this.type === 'CO2') {
                    this.vx = (Math.random() - 0.5) * 1; 
                }

                // Apply preliminary movement
                let nextX = this.x + this.vx;
                this.y += this.vy;

                // Boundary Logic (Deletion at top)
                if (this.y < -10) this.markedForDeletion = true;

                // Middle Membrane (CEM) Strict Logic
                if (this.x > CEM_X && nextX <= CEM_X + 2) {
                    // Cations approaching CEM from Right to Left
                    if (this.type === 'H+' || this.type === 'K+' || this.type === 'NH4+') {
                        if (window.crossover_quota >= 1) {
                            // Allowed to cross (charge balance maintained)
                            window.crossover_quota -= 1;
                            this.x = nextX;
                        } else {
                            // Blocked! Electric force is there, but no charge balance quota
                            this.x = CEM_X + 2;
                            this.vx = 0;
                        }
                    } else if (this.type === 'Cl-') {
                        // Anions blocked completely
                        this.x = CEM_X + 2;
                        this.vx = 0;
                    } else {
                        this.x = nextX;
                    }
                } else if (this.x < CEM_X && nextX >= CEM_X - 2) {
                    // Particles approaching CEM from Left to Right
                    if (this.type === 'HCO3-' || this.type === 'OH-' || this.type === 'CO2') {
                        // Blocked completely
                        this.x = CEM_X - 2;
                        this.vx = 0;
                    } else {
                        this.x = nextX;
                    }
                } else {
                    // Normal movement if not hitting CEM
                    this.x = nextX;
                }

                // Left & Right BP boundaries (Absolute barriers)
                if (this.x < LEFT_BP_X + 15) this.x = LEFT_BP_X + 15;
                if (this.x > RIGHT_BP_X - 15) this.x = RIGHT_BP_X - 15;
            }

            draw() {
                ctx.beginPath();
                if (this.type === 'CO2') {
                    ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
                    ctx.fillStyle = '#6c757d';
                    ctx.fill();
                    ctx.strokeStyle = '#333';
                    ctx.stroke();
                } else {
                    ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                    if (this.type === 'OH-') ctx.fillStyle = '#007bff';
                    if (this.type === 'H+') ctx.fillStyle = '#dc3545';
                    if (this.type === 'HCO3-') ctx.fillStyle = '#28a745';
                    if (this.type === 'NH4+') ctx.fillStyle = '#17a2b8';
                    if (this.type === 'K+') ctx.fillStyle = '#6f42c1';
                    if (this.type === 'Cl-') ctx.fillStyle = '#fd7e14';
                    ctx.fill();
                }

                // Chemical Label
                ctx.fillStyle = '#444';
                ctx.font = '10px Arial';
                ctx.fillText(this.type, this.x + 6, this.y + 4);
            }
        }

        function spawnParticles() {
            let volt = parseInt(slVolt.value);
            let co2 = parseInt(slCO2.value);
            let nacl = parseFloat(slNaCl.value);

            // Water Splitting (Current / Charge Generation)
            if (Math.random() < (volt / 100) * 0.4) {
                particles.push(new Particle('OH-', LEFT_BP_X + 20, Math.random() * canvas.height));
                particles.push(new Particle('H+', RIGHT_BP_X - 20, Math.random() * canvas.height));
                // Add to quota: 1 electron generated = 1 positive charge allowed to cross CEM
                window.crossover_quota += 1;
            }
            
            // Cap the quota so it doesn't build up infinitely if flow sweeps cations away
            window.crossover_quota = Math.min(window.crossover_quota, 5);

            // CO2 Upflow
            if (Math.random() < (co2 / 100) * 0.4) {
                particles.push(new Particle('CO2', LEFT_BP_X + 30 + Math.random() * 200, canvas.height + 10));
            }

            // Electrolyte Upflow
            if (Math.random() < (nacl / 5) * 0.6) {
                let cationType = (Math.random() < (1/7)) ? 'NH4+' : 'K+';
                particles.push(new Particle(cationType, CEM_X + 20 + Math.random() * 200, canvas.height + 10));
                particles.push(new Particle('Cl-', CEM_X + 20 + Math.random() * 200, canvas.height + 10));
            }
        }

        function checkCollisions() {
            let hCrossoverCount = 0;
            for (let i = 0; i < particles.length; i++) {
                let p1 = particles[i];

                if (p1.type === 'H+' && p1.x < CEM_X) {
                    hCrossoverCount++;
                }

                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    if (p1.markedForDeletion || p2.markedForDeletion) continue;

                    let dx = p1.x - p2.x;
                    let dy = p1.y - p2.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist < 15) {
                        // Reaction: CO2 + OH- -> HCO3-
                        if ((p1.type === 'CO2' && p2.type === 'OH-') || (p1.type === 'OH-' && p2.type === 'CO2')) {
                            p1.markedForDeletion = true;
                            p2.markedForDeletion = true;
                            particles.push(new Particle('HCO3-', (p1.x+p2.x)/2, (p1.y+p2.y)/2));
                        }
                        // Neutralization: H+ + OH- -> H2O
                        if ((p1.type === 'H+' && p2.type === 'OH-') || (p1.type === 'OH-' && p2.type === 'H+')) {
                            if (p1.x < CEM_X && p2.x < CEM_X) {
                                p1.markedForDeletion = true;
                                p2.markedForDeletion = true;
                            }
                        }
                    }
                }
            }
            updateStatusText(hCrossoverCount);
        }

        function updateStatusText(hCross) {
            let relFlow = parseInt(slRelFlow.value);
            let volt = parseInt(slVolt.value);
            
            if (volt > 70 && relFlow < 30) {
                statusBox.innerHTML = "🔴 WARNING: High H+ crossover! H+ is entering the Capture Chamber and neutralizing OH-!";
                statusBox.style.background = "#f8d7da";
                statusBox.style.color = "#721c24";
                statusBox.style.borderLeftColor = "#f5c6cb";
            } else if (hCross > 5) {
                statusBox.innerHTML = "🟡 Caution: Some H+ is crossing the CEM. Increase Release Flow or Electrolyte Conc. to protect pH.";
                statusBox.style.background = "#fff3cd";
                statusBox.style.color = "#856404";
                statusBox.style.borderLeftColor = "#ffeeba";
            } else {
                statusBox.innerHTML = "🟢 Optimal Operation: Charge Balance is buffered by K+/NH4+. Upflow secures the system.";
                statusBox.style.background = "#d4edda";
                statusBox.style.color = "#155724";
                statusBox.style.borderLeftColor = "#c3e6cb";
            }
        }

        function drawBackground() {
            // Chambers
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(LEFT_BP_X, 0, CEM_X - LEFT_BP_X, canvas.height);
            ctx.fillStyle = "#fdfdfd";
            ctx.fillRect(CEM_X, 0, RIGHT_BP_X - CEM_X, canvas.height);

            // Electrodes (Anode & Cathode)
            ctx.fillStyle = "#e74c3c"; // Red Anode
            ctx.fillRect(10, 0, 15, canvas.height);
            ctx.fillStyle = "#3498db"; // Blue Cathode
            ctx.fillRect(canvas.width - 25, 0, 15, canvas.height);
            
            ctx.save();
            ctx.translate(20, canvas.height/2);
            ctx.rotate(-Math.PI/2);
            ctx.fillStyle = "#fff";
            ctx.font = "bold 16px Arial";
            ctx.textAlign = "center";
            ctx.fillText("Anode (+)", 0, 0);
            ctx.restore();

            ctx.save();
            ctx.translate(canvas.width - 10, canvas.height/2);
            ctx.rotate(Math.PI/2);
            ctx.fillStyle = "#fff";
            ctx.font = "bold 16px Arial";
            ctx.textAlign = "center";
            ctx.fillText("Cathode (-)", 0, 0);
            ctx.restore();

            // Membranes Styling (Unified format)
            ctx.fillStyle = "#7f8c8d"; // BP color
            ctx.fillRect(LEFT_BP_X, 0, 10, canvas.height);
            ctx.fillRect(RIGHT_BP_X, 0, 10, canvas.height);
            
            ctx.fillStyle = "#f39c12"; // CEM color
            ctx.fillRect(CEM_X, 0, 10, canvas.height);

            // Membrane Labels (Unified)
            ctx.fillStyle = "#333";
            ctx.font = "bold 18px Arial";
            ctx.textAlign = "center";
            
            // Draw labels at the top
            ctx.fillText("BP", LEFT_BP_X + 5, 25);
            ctx.fillText("CEM", CEM_X + 5, 25);
            ctx.fillText("BP", RIGHT_BP_X + 5, 25);

            // Chamber Labels
            ctx.fillStyle = "rgba(0,0,0,0.1)";
            ctx.font = "bold 24px Arial";
            ctx.fillText("CAPTURE (Upflow)", (LEFT_BP_X + CEM_X)/2, canvas.height / 2);
            ctx.fillText("RELEASE (Upflow)", (CEM_X + RIGHT_BP_X)/2, canvas.height / 2);
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();
            
            let volt = parseInt(slVolt.value);
            let capF = parseInt(slCapFlow.value);
            let relF = parseInt(slRelFlow.value);
            let nacl = parseFloat(slNaCl.value);

            spawnParticles();
            checkCollisions();

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update(volt, capF, relF, nacl);
                p.draw();
                if (p.markedForDeletion) {
                    particles.splice(i, 1);
                }
            }

            if (particles.length > 500) {
                particles.splice(0, particles.length - 500);
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
